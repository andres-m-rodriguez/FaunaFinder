# Run when commits are pushed to master
on:
  workflow_dispatch:
    inputs:
      force-deploy-all:
        description: 'Deploy all services regardless of changes'
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ASPIRE_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install tools
        run: |
          dotnet tool install -g dotnet-affected
          dotnet tool install -g aspire.cli --prerelease

      - name: Detect affected projects
        id: affected
        run: |
          dotnet affected -p . --from HEAD~1 --to HEAD --format text -o affected.txt || true
          if [ -f affected.txt ] && [ -s affected.txt ]; then
            cat affected.txt
            AFFECTED=$(cat affected.txt | tr '\n' ',' | sed 's/,$//')
            echo "AFFECTED_PROJECTS=$AFFECTED" >> $GITHUB_ENV
            echo "Affected projects: $AFFECTED"
          else
            echo "No affected projects detected"
          fi

      - name: Log in with Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: aspire do deploy --project src/FaunaFinder.AppHost --environment Production --non-interactive
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          AFFECTED_PROJECTS: ${{ env.AFFECTED_PROJECTS }}
          FORCE_DEPLOY_ALL: ${{ github.event.inputs.force-deploy-all }}
