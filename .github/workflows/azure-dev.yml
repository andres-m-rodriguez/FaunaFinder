# Run when commits are pushed to master
on:
  workflow_dispatch:
    inputs:
      force-deploy-all:
        description: 'Deploy all services regardless of changes'
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
  ASPIRE_CLI_TELEMETRY_OPTOUT: 1
  ASPIRE_CLI_NOLOGO: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - run: dotnet tool install -g dotnet-affected && dotnet tool install -g aspire.cli --prerelease

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy affected resources
        env:
          Azure__SubscriptionId: ${{ env.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ env.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
        run: |
          # Get affected projects
          dotnet affected -p . --from HEAD~1 --to HEAD --format text -o affected.txt || true

          # Read resource mappings from JSON
          MAPPINGS=$(cat deployable-resources.json)

          # Determine which resources to deploy
          RESOURCES_TO_DEPLOY=""

          if [ "${{ github.event.inputs.force-deploy-all }}" == "true" ]; then
            echo "Force deploy all enabled"
            RESOURCES_TO_DEPLOY=$(echo "$MAPPINGS" | jq -r '.projectToResource | values | .[]')
          elif [ -f affected.txt ] && [ -s affected.txt ]; then
            echo "Affected projects:"
            cat affected.txt
            while IFS= read -r project; do
              resource=$(echo "$MAPPINGS" | jq -r --arg p "$project" '.projectToResource[$p] // empty')
              if [ -n "$resource" ]; then
                RESOURCES_TO_DEPLOY="$RESOURCES_TO_DEPLOY $resource"
              fi
            done < affected.txt
          else
            echo "No affected projects detected - deploying all"
            RESOURCES_TO_DEPLOY=$(echo "$MAPPINGS" | jq -r '.projectToResource | values | .[]')
          fi

          # Deploy each affected resource
          for resource in $RESOURCES_TO_DEPLOY; do
            echo "Deploying $resource..."
            aspire do deploy-$resource --project src/FaunaFinder.AppHost --environment Production --non-interactive
          done
